services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: switchpath-falkordb
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - switchpath_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  switchpath_data:
